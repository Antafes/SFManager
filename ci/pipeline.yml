resource_types:
  - name: pull-request
    type: docker-image
    source:
      repository: teliaoss/github-pr-resource

resources:
- name: sfmanager-repo
  type: git
  source:
    uri: https://github.com/Antafes/SFManager
    branch: main
    private_key: ((private_key))
- name: sfmanager-repo-pr
  type: pull-request
  check_every: 10m
  source:
    repository: Antafes/SFManager
    access_token: ((access_token))
- name: sfmanager-release
  type: github-release
  source:
    owner: Antafes
    repository: SFManager
    release: true
    drafts: false
    access_token: ((access_token))
- name: dependency-scan-schedule
  type: time
  source:
    start: 6:00 AM
    stop: 6:01 AM
    days: [Monday]
    location: UTC

jobs:
- name: sfmanager-pr
  plan:
    - get: sfmanager-repo-pr
      trigger: true
      version: every
    - put: sfmanager-repo-pr
      params:
        path: sfmanager-repo-pr
        status: pending
    - task: unit-test
      config:
        platform: linux
        image_resource:
          type: docker-image
          source:
            repository: maven
            tag: 3-eclipse-temurin-25
        inputs:
          - name: sfmanager-repo-pr
        run:
          path: ci/test.sh
          args: ["((maven_access_token))"]
          dir: sfmanager-repo-pr
        caches:
          - path: maven
      on_failure:
        put: sfmanager-repo-pr
        params:
          path: sfmanager-repo-pr
          status: failure
    - put: sfmanager-repo-pr
      params:
        path: sfmanager-repo-pr
        status: success

- name: sfmanager
  plan:
  - get: sfmanager-repo
    trigger: true
  - get: sfmanager-release
  - task: check-version
    config:
      platform: linux
      image_resource:
        type: docker-image
        source:
          repository: debian
          tag: stable-slim
      inputs:
      - name: sfmanager-repo
      - name: sfmanager-release
      run:
        path: ci/check-version.sh
        dir: sfmanager-repo
  - task: build
    config:
      platform: linux
      image_resource:
        type: docker-image
        source:
          repository: maven
          tag: 3-eclipse-temurin-25
      inputs:
      - name: sfmanager-repo
      outputs:
      - name: dist
      run:
        path: ci/build.sh
        args: ["((maven_access_token))"]
        dir: sfmanager-repo
      caches:
        - path: maven
  - put: sfmanager-release
    params:
      name: dist/name
      tag: dist/tag
      globs:
      - dist/*.zip

- name: sfmanager-dependency-scan
  plan:
  - get: dependency-scan-schedule
    trigger: true
  - get: sfmanager-repo
  - task: check-dependency-updates
    config:
      platform: linux
      image_resource:
        type: docker-image
        source:
          repository: maven
          tag: 3-eclipse-temurin-25
      inputs:
      - name: sfmanager-repo
      outputs:
      - name: target
      run:
        path: ci/check-dependency-updates.sh
        args: ["((maven_access_token))"]
        dir: sfmanager-repo
      caches:
        - path: maven
  - task: create-dependency-issue
    config:
      platform: linux
      image_resource:
        type: docker-image
        source:
          repository: debian
          tag: stable-slim
      inputs:
      - name: sfmanager-repo
      - name: target
      run:
        path: sh
        args:
          - -c
          - apt-get update -qq && apt-get install -y -qq curl && ci/create-dependency-issue.sh "((github_access_token))"
        dir: sfmanager-repo

